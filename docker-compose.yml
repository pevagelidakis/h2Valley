# Production stack for a single VM (e.g. Oracle Cloud Always Free):
#   internet -> Caddy (80/443, automatic HTTPS when SITE_ADDRESS is a domain) -> gunicorn app
# Usage:  docker compose up -d --build
#         SITE_ADDRESS=mydash.duckdns.org docker compose up -d   # HTTPS on your domain
services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "7860"
    volumes:
      - app_cache:/home/app/h2valley/.cache   # keeps precompute results across restarts

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}   # ":80" = plain HTTP on the VM's IP
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  # Public HTTPS link without router/port-forwarding setup (Cloudflare quick tunnel).
  # The URL (https://<random>.trycloudflare.com) changes on every restart; find it with:
  #   docker compose logs tunnel | Select-String trycloudflare
  # Disable by running only the other services:  docker compose up -d app caddy
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - caddy
    # http2 (TCP) instead of the default QUIC (UDP): many home routers/ISPs throttle
    # UDP, which made the tunnel crawl at a few KB/s.
    command: tunnel --no-autoupdate --protocol http2 --url http://caddy:80

volumes:
  caddy_data:
  app_cache:
